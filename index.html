<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Plano de Estudos ETEC</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--ac:#2f6bff;--ok:#2f6bff;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eef0f6;--mut:#99a;--bd:#2c3040}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eef0f6;--mut:#99a;--bd:#2c3040}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:560px}
h1{font-size:22px;margin:4px 0}h3{margin:14px 0 6px;font-size:15px}
.sub{color:var(--mut);font-size:13px}.small{font-size:12px;color:var(--mut);margin-top:6px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hero div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}
.hero b{display:block;font-size:22px;color:var(--ac)}.hero span{font-size:11px;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.cores{display:flex;gap:10px;margin:10px 0}.cores button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.cores button.on{border-color:var(--tx)}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:14px;flex-wrap:wrap}
input[type=number]{width:70px;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
input[type=text],textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;margin-top:6px}
.tm{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.tmv{font-size:28px;font-weight:700;color:var(--ac);min-width:90px;text-align:center}
details{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}summary{font-weight:600}details p{margin:6px 0;color:var(--mut)}
.warn{border-color:#f5a623}.tag{display:inline-block;background:var(--bd);border-radius:8px;padding:2px 8px;font-size:12px;margin-left:6px}
.reset{margin:14px 0 24px;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font-size:14px}
.sec{display:none}.sec.on{display:block}svg{width:100%;height:auto}
</style></head><body>
<h1>📚 Plano de Estudos ETEC</h1>
<div class="sub" id="frase"></div>
<div class="cores" id="cores"></div>
<div class="hero"><div><b id="dias">-</b><span>dias até a prova</span></div><div><b id="blo">0</b><span>blocos de estudo</span></div><div><b id="seq">0</b><span>dias seguidos</span></div></div>
<div class="bar"><i id="bar"></i></div><div class="sub" id="pct"></div>
<div class="tabs" id="tabs"></div>
<div id="hoje" class="sec"></div><div id="est" class="sec"></div><div id="prat" class="sec"></div><div id="car" class="sec"></div><div id="plano" class="sec"></div><div id="mat" class="sec"></div><div id="sim" class="sec"></div><div id="mais" class="sec"></div>
<button class="reset" id="reset">Limpar tudo</button>
<script>
var KEY="estudo-v1",S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var start=new Date(2026,10,3),exam=new Date(2026,11,6,13,30),now=new Date();
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var today=key(now),cw=Math.max(0,Math.min(4,Math.floor((now-start)/6048e5)));
function esc(x){return String(x||"").replace(/"/g,"&quot;")}
function ck(k,l){return '<label class="chk"><input type="checkbox" data-k="'+k+'"'+(S[k]?' checked':'')+'><span>'+l+'</span></label>'}
function num(k,l){return '<div class="row"><span>'+l+'</span><input type="number" min="0" inputmode="numeric" data-k="'+k+'" value="'+(S[k]||"")+'"></div>'}
function dtl(a){return a.map(function(x){return '<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join("")}
var M={mat:["🔢","Matemática",["operações, frações, decimais, porcentagem","razão e proporção, regra de três, juros simples","equações de 1º e 2º grau, sistemas","ângulos, áreas e perímetros, volumes, teorema de Pitágoras","gráficos e tabelas, estatística básica, probabilidade, revisão"]],
por:["📖","Português",["interpretação de texto, gêneros textuais","classes de palavras, concordância","pontuação, regência, crase, figuras de linguagem","variação linguística, coesão e coerência, tipologia textual","revisão geral e questões de provas anteriores"]],
cie:["🧬","Ciências",["corpo humano, seres vivos","ecologia, meio ambiente","matéria, misturas, átomo, tabela periódica","movimento, energia, eletricidade","revisão geral e questões de provas anteriores"]],
his:["🏛️","História",["Brasil Colônia e Império","República, Era Vargas, ditadura militar","revoluções, guerras mundiais","Brasil atual, direitos e cidadania","revisão geral e questões de provas anteriores"]],
geo:["🌎","Geografia",["cartografia, coordenadas, escalas","clima, relevo, vegetação","população e urbanização","globalização, economia, atualidades","revisão geral e questões de provas anteriores"]]};
var ORD=["mat","por","cie","his","geo"],SCH={0:["rev"],1:["mat","por"],2:["por","cie"],3:["mat","his"],4:["por","cie"],5:["mat","geo"],6:["sim","err"]};
function topics(c){return M[c][2].join(", ").split(", ")}
var HAB=["Celular longe durante o estudo","Dormi 8 horas","Revisei meus erros","Bebi água","Fiz as pausas"];
var NV=[["🌱 Calouro",0],["📘 Estudioso",100],["🎯 Focado",300],["💡 Brilhante",600],["🏅 Craque",1000],["👑 Mestre",1500]];
var FR=["Constância vence maratona de véspera.","Um bloco de cada vez.","Errar na prova de treino é ganhar na prova de verdade.","Estudar um pouco todo dia vale mais que muito num dia só.","Você está mais perto do que ontem."];
function sum(re){var n=0;for(var k in S)if(re.test(k))n+=+S[k]||0;return n}
function cnt(re){var n=0;for(var k in S)if(S[k]===true&&re.test(k))n++;return n}
function sims(){return S.sim||[]}
function pts(){return sum(/^h[\d-]+pm$/)*10+cnt(/^h[\d-]+b\d$/)*3+cnt(/^a[a-z]+\d+$/)*5+cnt(/^s[a-z]{3}\d+$/)*5+cnt(/^fc\d+$/)*2+cnt(/^w\dok$/)*20+sims().length*30+(S.err||[]).length*2}
function lv(){var p=pts(),i=0;NV.forEach(function(n,j){if(p>=n[1])i=j});return i}
function streak(){var c=0,d=new Date();for(var i=0;i<40;i++){if(+S["h"+key(d)+"pm"]>0)c++;else if(i>0)break;d.setDate(d.getDate()-1)}return c}
function maxNota(){var m=0;sims().forEach(function(x){if(x.n>m)m=x.n});return m}
// HOJE
var wd=now.getDay(),h="";
if(!S.insc)h+='<div class="card warn"><h2>⚠️ Confirme sua inscrição</h2><div class="sub">O prazo original acaba hoje (3/11) às 20h. Notícias falam em prorrogação até 10/11, mas confirme no site vestibulinho.etec.sp.gov.br.</div>'+ck("insc","Já fiz minha inscrição")+'</div>';
h+='<div class="card"><h2>Hoje · '+now.getDate()+' '+MO[now.getMonth()]+'</h2><div class="sub">Semana '+(cw+1)+' de 5 · meta de hoje: 4 blocos de 25 min</div>';
SCH[wd].forEach(function(c){if(c==="sim")h+='<h3>📝 Simulado ou provas anteriores</h3><div class="sub">Faça uma prova completa de 50 questões, com tempo, e registre na aba Simulados. Depois corrija e anote os erros.</div>';
 else if(c==="err")h+='<h3>📓 Revisão dos erros</h3><div class="sub">Corrija o simulado e estude os assuntos que você errou.</div>';else if(c==="rev")h+='<h3>🔁 Revisão e descanso</h3><div class="sub">Releia o caderno de erros e descanse. Dormir bem fixa o que você estudou.</div>';
 else h+='<h3>'+M[c][0]+' '+M[c][1]+'</h3><div class="sub">Foco da semana: '+M[c][2][cw]+'</div>'+num("h"+today+c+"q","Questões feitas hoje")+num("h"+today+c+"a","Acertos")});
h+='</div><div class="card"><h2>⏱️ Bloco de foco (25 min)</h2><div class="sub">25 min de estudo, 5 de pausa. Cada bloco completo vale +10 pontos.</div><div class="row"><button class="tm" id="pb">▶ Iniciar foco</button><span class="tmv" id="pt">25:00</span></div><div class="row"><b id="pc"></b><button class="tm" id="pa">+1 bloco manual</button></div><div class="bar"><i id="pbar"></i></div></div><div class="card"><h2>✅ Hábitos do dia</h2>';
HAB.forEach(function(x,i){h+=ck("h"+today+"b"+i,x)});
h+='</div><div class="card"><h2>📓 Caderno de erros</h2><div class="sub">Anote o assunto de cada questão que errou. Revise toda semana. Cada erro anotado vale +2.</div><input type="text" id="ei" placeholder="Ex.: regra de três inversa"><div class="row"><button class="tm" id="ea">Adicionar erro</button></div><div id="el"></div></div>';
document.getElementById("hoje").innerHTML=h;
function pm(){return +S["h"+today+"pm"]||0}
function showpm(){document.getElementById("pc").textContent=pm()+" de 4 blocos hoje";document.getElementById("pbar").style.width=Math.min(100,pm()/4*100)+"%"}
function addpm(){S["h"+today+"pm"]=pm()+1;save();showpm();prog()}
var pI=0,ph="f",left=1500;
function fm(n){return Math.floor(n/60)+":"+("0"+n%60).slice(-2)}
document.getElementById("pa").onclick=addpm;
document.getElementById("pb").onclick=function(){var b=this,t=document.getElementById("pt");if(pI){clearInterval(pI);pI=0;b.textContent="▶ Iniciar foco";ph="f";left=1500;t.textContent="25:00";return}
 b.textContent="⏸ Parar";ph="f";left=1500;pI=setInterval(function(){left--;t.textContent=(ph==="f"?"":"☕ ")+fm(left);if(left<=0){try{navigator.vibrate([300,150,300])}catch(e){}
  if(ph==="f"){addpm();ph="p";left=300}else{clearInterval(pI);pI=0;b.textContent="▶ Iniciar foco";t.textContent="Pausa acabou!"}}},1000)};
function errs(){var e=S.err||[],o="";e.slice(-8).reverse().forEach(function(x,i){var idx=e.length-1-i;o+='<div class="chk"><span style="flex:1">'+esc(x.t)+' <span class="small">'+x.d+'</span></span><button class="tm" data-ed="'+idx+'" style="padding:4px 8px;font-size:12px">Apagar</button></div>'});
 document.getElementById("el").innerHTML=(e.length?'<div class="small">'+e.length+' erros anotados</div>':'')+o}
document.getElementById("ea").onclick=function(){var i=document.getElementById("ei"),t=i.value.trim();if(!t)return;S.err=(S.err||[]).concat([{t:t,d:now.getDate()+"/"+(now.getMonth()+1)}]);save();i.value="";errs();prog()};
document.getElementById("hoje").addEventListener("click",function(e){var d=e.target.getAttribute("data-ed");if(d!==null){S.err.splice(+d,1);save();errs();prog()}});
// PLANO
var W0=["Diagnóstico e base","Fortalecer a base","Conteúdo intermediário","Conteúdo avançado","Revisão final e simulados"];h='<div class="card"><h2>🗓️ Rotina da semana</h2><p class="sub">• Seg: Matemática + Português<br>• Ter: Português + Ciências<br>• Qua: Matemática + História<br>• Qui: Português + Ciências<br>• Sex: Matemática + Geografia<br>• Sáb: Simulado + revisão dos erros<br>• Dom: revisão dos erros e descanso<br>Meta: 4 blocos de 25 min por dia. Se um dia faltar, não tente compensar tudo: volte ao plano.</p></div>';
for(var w=0;w<5;w++){var a=new Date(start);a.setDate(a.getDate()+w*7);var b=new Date(a);b.setDate(b.getDate()+(w===4?0:6));
 h+='<details'+(w===cw?' open':'')+'><summary>Semana '+(w+1)+' · '+W0[w]+' <span class="tag">'+a.getDate()+' '+MO[a.getMonth()]+' a '+b.getDate()+' '+MO[b.getMonth()]+'</span></summary>';
 ORD.forEach(function(c){h+='<p><b>'+M[c][0]+' '+M[c][1]+':</b> '+M[c][2][w]+'</p>'});
 h+=ck("w"+w+"ok","Semana concluída (+20 pontos)")+'</details>'}
document.getElementById("plano").innerHTML='<div class="card" style="padding:4px 14px">'+h.replace('</p></div>','</p></div><div>')+'</div>';
// MATERIAS
function acc(c){var q=sum(new RegExp("^h[\\d-]+"+c+"q$")),a=sum(new RegExp("^h[\\d-]+"+c+"a$"));return[q,a]}
h="";ORD.forEach(function(c){var t=topics(c),n=0,r=acc(c);t.forEach(function(x,i){if(S["a"+c+i])n++});
 h+='<div class="card"><h2>'+M[c][0]+' '+M[c][1]+'</h2><div class="sub">'+n+' de '+t.length+' assuntos · '+r[0]+' questões · '+(r[0]?Math.round(r[1]/r[0]*100)+'% de acerto':'sem questões ainda')+'</div><div class="bar"><i style="width:'+Math.round(n/t.length*100)+'%"></i></div>';
 t.forEach(function(x,i){h+=ck("a"+c+i,x)});h+='</div>'});
document.getElementById("mat").innerHTML=h;
// SIMULADOS
function simUi(){var s=sims(),meta=+S.meta||30,o='<div class="card"><h2>🎯 Meta e registro</h2>'+num("meta","Minha meta (acertos de 50)")+num("sn","Acertos no simulado (de 50)")+num("st","Tempo gasto (minutos)")+'<div class="row"><button class="tm" id="sa">Registrar simulado (+30)</button></div></div>';
 if(s.length){var W=320,H=120,bw=Math.min(28,260/s.length),g=(W-s.length*bw)/(s.length+1),av=Math.round(s.reduce(function(a,x){return a+x.n},0)/s.length*10)/10;
  o+='<div class="card"><h2>📈 Meus simulados</h2><div class="sub">Média: '+av+' · melhor: '+maxNota()+' · meta: '+meta+'</div><svg viewBox="0 0 '+W+' '+(H+24)+'">';
  s.forEach(function(x,i){var xx=g+i*(bw+g),hh=Math.round(x.n/50*H);o+='<rect x="'+xx+'" y="'+(H-hh)+'" width="'+bw+'" height="'+hh+'" rx="5" style="fill:'+(x.n>=meta?"var(--ok)":"var(--ac)")+'"/><text x="'+(xx+bw/2)+'" y="'+(H-hh-4)+'" font-size="11" text-anchor="middle" fill="currentColor">'+x.n+'</text><text x="'+(xx+bw/2)+'" y="'+(H+14)+'" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">'+x.d+'</text>'});
  o+='</svg>';s.slice(-5).reverse().forEach(function(x,i){var idx=s.length-1-i;o+='<div class="chk"><span style="flex:1">'+x.d+' · '+x.n+'/50'+(x.t?' · '+x.t+' min':'')+'</span><button class="tm" data-sd="'+idx+'" style="padding:4px 8px;font-size:12px">Apagar</button></div>'});o+='</div>'}
 o+='<div class="card"><h2>🎒 Checklist do dia da prova</h2>';["Documento de identidade original","Caneta esferográfica azul ou preta","Lápis preto nº 2","Borracha","Régua","Água e um lanche leve","Local da prova conferido (divulgado em 2/12)","Saí de casa com folga de tempo"].forEach(function(x,i){o+=ck("dp"+i,x)});
 o+='</div><div class="card"><h2>🧠 Estratégia na prova</h2><p class="sub">• São 50 questões de múltipla escolha, então em edições recentes a prova durou 4 horas (confira no manual), o que dá uns 4 minutos por questão<br>• Faça primeiro as que você tem certeza e marque as difíceis para voltar<br>• Leia o enunciado inteiro e elimine as alternativas erradas<br>• Passe o gabarito com calma, conferindo a numeração<br>• Confira no Manual do Candidato as regras e a distribuição das matérias</p></div>';
 document.getElementById("sim").innerHTML=o}
document.getElementById("sim").addEventListener("click",function(e){if(e.target.id==="sa"){var n=+S.sn||0,t=+S.st||0;if(n<=0||n>50){alert("Digite os acertos de 0 a 50");return}S.sim=sims().concat([{n:n,t:t,d:now.getDate()+"/"+(now.getMonth()+1)}]);S.sn="";S.st="";save();simUi();prog()}
 var d=e.target.getAttribute("data-sd");if(d!==null){S.sim.splice(+d,1);save();simUi();prog()}});
// MAIS
function medals(){var p=pts(),b=sum(/^h[\d-]+pm$/),a=cnt(/^a[a-z]+\d+$/),n=sims().length,m=maxNota(),st=streak(),e=(S.err||[]).length;
 return[[b>=1,"⏱️ Primeiro bloco"],[b>=10,"⏱️ 10 blocos"],[b>=30,"⏱️ 30 blocos"],[b>=60,"⏱️ 60 blocos"],[b>=100,"⏱️ 100 blocos"],[a>=5,"📚 5 assuntos"],[a>=15,"📚 15 assuntos"],[a>=30,"📚 30 assuntos"],[n>=1,"📝 Primeiro simulado"],[n>=3,"📝 3 simulados"],[n>=5,"📝 5 simulados"],[m>=25,"🎯 25 acertos"],[m>=30,"🎯 30 acertos"],[m>=35,"🎯 35 acertos"],[m>=40,"🎯 40 acertos"],[st>=3,"🔥 3 dias seguidos"],[st>=7,"🔥 7 dias seguidos"],[st>=14,"🔥 14 dias seguidos"],[e>=5,"📓 5 erros anotados"],[e>=20,"📓 20 erros anotados"],[p>=500,"⭐ 500 pontos"],[lv()>=5,"👑 Nível Mestre"]]}
function maisUi(){var p=pts(),i=lv(),n=NV[i],x=NV[i+1],pc=x?Math.round((p-n[1])/(x[1]-n[1])*100):100,md=medals(),got=md.filter(function(a){return a[0]}).length;
 var o='<div class="card"><h2>'+n[0]+'</h2><div class="sub">'+p+' pontos'+(x?' · faltam '+(x[1]-p)+' para '+x[0]:' · nível máximo!')+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="small">Bloco +10 · assunto +5 · simulado +30 · semana +20 · hábito +3 · erro anotado +2</div></div>';
 o+='<div class="card"><h2>🏅 Medalhas <span class="tag">'+got+'/'+md.length+'</span></h2>'+md.map(function(a){return '<div class="chk" style="opacity:'+(a[0]?1:.4)+'">'+a[1]+'</div>'}).join("")+'</div>';

mat:[
["Quando uma conta tem várias operações, siga a ordem: 1º parênteses, 2º potências e raízes, 3º multiplicação e divisão (da esquerda para a direita), 4º soma e subtração.<br>Com números negativos: sinais iguais somam e mantêm o sinal; sinais diferentes subtraem e ficam com o sinal do maior. Na multiplicação e na divisão: sinais iguais dão +, sinais diferentes dão −.","Calcule 3 + 4 × (8 − 2)² ÷ 6.<br>1) Parênteses: 8 − 2 = 6<br>2) Potência: 6² = 36<br>3) Multiplicação e divisão: 4 × 36 = 144 e 144 ÷ 6 = 24<br>4) Soma: 3 + 24 = 27.","Não some antes de multiplicar: 3 + 4 × 2 é 11, não 14.","Quanto é −5 + 8 × (−2)?","8 × (−2) = −16, e −5 + (−16) = −21."],
["Para somar ou subtrair frações, os denominadores precisam ser iguais: ache o MMC, transforme as frações e some os numeradores. Multiplicar é direto: cima com cima, baixo com baixo. Dividir é multiplicar pelo inverso da segunda. No fim, simplifique.","Calcule 1/2 + 2/3.<br>MMC de 2 e 3 = 6. Então 1/2 = 3/6 e 2/3 = 4/6.<br>3/6 + 4/6 = 7/6.<br>Agora 3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = 3/2.","Nunca some denominador com denominador: 1/2 + 1/3 não é 2/5.","Quanto é 2/5 × 10?","2/5 × 10 = 20/5 = 4."],
["Porcentagem é uma fração de denominador 100: 25% = 25/100 = 0,25. Para achar p% de um valor, multiplique por p/100. Desconto: multiplique por (1 − taxa). Aumento: multiplique por (1 + taxa).","Uma camiseta de R$ 120 aumentou 25%.<br>Aumento = 120 × 0,25 = 30.<br>Novo preço = 120 + 30 = R$ 150 (ou direto: 120 × 1,25).","Dois descontos de 10% seguidos não dão 20%: o segundo incide sobre o novo preço (100 → 90 → 81).","Um salário de R$ 2.000 teve aumento de 8%. Qual o novo valor?","2.000 × 1,08 = R$ 2.160."],
["Duas grandezas são diretamente proporcionais quando uma aumenta e a outra aumenta na mesma proporção (mais produtos, mais dinheiro). São inversamente proporcionais quando uma aumenta e a outra diminui (mais pessoas, menos tempo). Monte uma tabela, decida se é direta ou inversa e resolva.","Direta: 3 cadernos custam R$ 24. Quanto custam 5?<br>3 → 24 e 5 → x, então 3x = 5 × 24 e x = R$ 40.<br>Inversa: 6 pedreiros levam 10 dias. 15 pedreiros levam?<br>6 × 10 = 15 × x, então x = 4 dias.","Pergunte sempre: se uma aumenta, a outra aumenta ou diminui?","Um carro faz 120 km com 10 litros. Quantos km faz com 25 litros?","É direta: 120 × 25 ÷ 10 = 300 km."],
["Juros simples são calculados sempre sobre o valor inicial (capital). Fórmula: J = C × i × t, com a taxa em decimal (3% = 0,03) e o tempo na mesma unidade da taxa. O montante é o total: M = C + J.","Emprestei R$ 2.000 a 3% ao mês por 4 meses.<br>J = 2000 × 0,03 × 4 = R$ 240.<br>M = 2000 + 240 = R$ 2.240.","Taxa ao mês pede tempo em meses. Se vier em anos, converta.","Qual o juro de R$ 500 a 2% ao mês durante 6 meses?","500 × 0,02 × 6 = R$ 60."],
["Equação de 1º grau: deixe o x sozinho. O que soma passa subtraindo, e o que multiplica passa dividindo. Sistema: substituição (isole uma letra e troque na outra) ou adição (some as equações para cancelar uma letra). Equação de 2º grau: Δ = b² − 4ac e x = (−b ± √Δ) ÷ 2a.","Resolva x + y = 10 e x − y = 2.<br>Somando: 2x = 12, então x = 6 e y = 4.<br>2º grau: x² − 5x + 6 = 0. Δ = 25 − 24 = 1.<br>x = (5 ± 1) ÷ 2, então x = 3 ou x = 2.","Ao trocar de lado, o sinal muda. Confira sempre substituindo na equação.","Resolva 3x − 4 = 11.","3x = 15, então x = 5."],
["São fórmulas que poupam tempo. Quadrado da soma: (a + b)² = a² + 2ab + b². Quadrado da diferença: (a − b)² = a² − 2ab + b². Soma vezes diferença: (a + b)(a − b) = a² − b². Fatorar é o caminho de volta: colocar o fator comum em evidência ou reconhecer essas fórmulas.","(x + 3)² = x² + 2·x·3 + 9 = x² + 6x + 9.<br>(x + 5)(x − 5) = x² − 25.<br>Fatorar 4x + 12: fator comum 4, então 4(x + 3).","(x + 3)² não é x² + 9: falta o termo do meio, 6x.","Desenvolva (x − 2)².","x² − 4x + 4."],
["Perímetro é o contorno (soma dos lados). Área é a superfície. Retângulo: b × h. Triângulo: b × h ÷ 2. Trapézio: (B + b) × h ÷ 2. Círculo: π × r². No triângulo retângulo vale Pitágoras: hipotenusa² = cateto² + cateto². A soma dos ângulos internos de um triângulo é 180°.","Triângulo de base 10 e altura 6: área = 10 × 6 ÷ 2 = 30.<br>Círculo de raio 3 (π ≈ 3,14): área = 3,14 × 9 = 28,26.<br>Escada de 5 m, pé a 3 m da parede: altura² = 25 − 9 = 16, então 4 m.","Não esqueça o ÷ 2 no triângulo, e use o raio (metade do diâmetro) no círculo.","Um trapézio tem bases 8 e 4 e altura 5. Qual a área?","(8 + 4) × 5 ÷ 2 = 30."],
["Volume é o espaço que um sólido ocupa. Prismas e cilindros: área da base × altura. Cubo: a × a × a. Paralelepípedo: comprimento × largura × altura. Cilindro: π × r² × h. Unidades: 1 m³ = 1.000 litros e 1 dm³ = 1 litro.","Caixa-d’água de 2 m × 1 m × 1,5 m: V = 3 m³ = 3.000 litros.<br>Cilindro de raio 2 e altura 10: V = 3,14 × 4 × 10 = 125,6.","Converta tudo para a mesma unidade antes de calcular.","Qual o volume de um cubo de aresta 4 cm?","4 × 4 × 4 = 64 cm³."],
["Média: some tudo e divida pela quantidade. Mediana: ordene os valores e pegue o do meio (se forem dois, tire a média deles). Moda: o valor que mais se repete. Probabilidade: casos favoráveis ÷ casos possíveis, de 0 (impossível) a 1 (certo).","Notas 5, 7, 7, 8, 10.<br>Média = 37 ÷ 5 = 7,4. Mediana = 7. Moda = 7.<br>Urna com 3 bolas vermelhas e 7 azuis: P(vermelha) = 3/10 = 30%.","Ordene os dados antes de achar a mediana.","Qual a mediana de 3, 9, 4, 7 e 1?","Em ordem: 1, 3, 4, 7, 9. A mediana é 4."],
["Para converter, veja se vai multiplicar ou dividir. Para uma unidade menor (m para cm), multiplique. Para uma maior (cm para m), divida. Área e volume mudam mais rápido: 1 m² = 10.000 cm². Para passar km/h para m/s, divida por 3,6.","2,5 km = 2.500 m. 3 h 30 min = 210 min.<br>72 km/h ÷ 3,6 = 20 m/s.<br>90 km em 1h30: velocidade = 90 ÷ 1,5 = 60 km/h.","1h30 é 1,5 hora, não 1,30.","Quantos litros cabem em 0,5 m³?","0,5 × 1.000 = 500 litros."]],
por:[
["Interpretar é entender o que o texto diz (explícito) e o que sugere (implícito). Leia o texto todo, ache o tema e a ideia central, depois leia a pergunta e volte ao trecho certo. Elimine alternativas que exageram, que usam ‘sempre’ e ‘nunca’ sem apoio ou que trazem ideias que não estão no texto.","Texto: ‘Mesmo cansado, Pedro estudou até tarde, pois a prova era decisiva.’<br>Por que Pedro estudou até tarde? Porque a prova era importante. O ‘pois’ indica a causa.","A alternativa pode ser verdadeira no mundo real e estar errada, se o texto não diz isso.","No exemplo, o que ‘mesmo’ indica em ‘Mesmo cansado’?","Concessão: apesar do cansaço, ele estudou."],
["Tipo textual é a estrutura: narrativo (personagens, tempo e ação), descritivo (características), dissertativo-argumentativo (defende uma opinião com argumentos), injuntivo (ordens e instruções) e expositivo (informa e explica). Gênero é o formato social: notícia, crônica, carta, receita, anúncio, charge.","Receita de bolo: gênero receita, tipo injuntivo (‘misture’, ‘asse’).<br>Notícia: tipo expositivo, pois informa fatos.<br>Artigo de opinião: tipo dissertativo-argumentativo.","Charges e tirinhas usam humor para criticar. Leia a imagem junto com o texto.","Um texto que descreve uma praça (cores, árvores, bancos) é de qual tipo?","Descritivo."],
["Substantivo dá nome (casa, Ana). Adjetivo caracteriza o substantivo (casa grande). Verbo indica ação ou estado. Advérbio modifica verbo, adjetivo ou advérbio (muito, rapidamente, aqui, hoje). Pronome substitui o substantivo (ele, meu, este). Preposição liga termos (de, em, para). Conjunção liga orações (e, mas, porque).","‘A menina muito inteligente respondeu rapidamente.’<br>menina = substantivo; inteligente = adjetivo; muito = advérbio (modifica ‘inteligente’); respondeu = verbo; rapidamente = advérbio.","A mesma palavra muda de classe conforme o uso: ‘bom’ é adjetivo, e ‘o bom’ é substantivo.","Em ‘Ele mora aqui’, qual a classe de ‘aqui’?","Advérbio de lugar."],
["O verbo varia em pessoa, número, tempo e modo. Indicativo: certeza (estudo, estudei, estudarei). Subjuntivo: dúvida ou desejo (talvez eu estude; se eu estudasse). Imperativo: ordem ou pedido (estude!). Pretérito perfeito: ação concluída (comi). Imperfeito: ação habitual no passado (comia). Voz passiva: o sujeito recebe a ação.","‘Se eu estudasse mais, passaria.’ → pretérito imperfeito do subjuntivo (estudasse) + futuro do pretérito (passaria).<br>Ativa: Ana fez o bolo. Passiva: O bolo foi feito por Ana.","Verbos irregulares mudam o radical: eu fiz (não ‘fazi’), eu pus (não ‘ponhei’).","Passe para a voz passiva: ‘O professor corrigiu a prova.’","A prova foi corrigida pelo professor."],
["O verbo concorda com o sujeito. Para achar o sujeito, pergunte ‘quem faz a ação?’. Sujeito composto leva o verbo no plural (Ana e Beto chegaram). Haver no sentido de existir e fazer indicando tempo não têm sujeito e ficam no singular (Há alunos. Faz dois anos). Na concordância nominal, artigo e adjetivo acompanham o substantivo (as casas bonitas).","‘Houve muitos problemas.’ (não ‘houveram’)<br>‘Fazia dois anos que ele não vinha.’<br>‘Os livros e a caneta estão na mesa.’","‘Existem’ concorda com o sujeito (Existem problemas), mas ‘há’ e ‘houve’ não.","Complete: ‘Já ___ três meses que não o vejo.’ (faz/fazem)","Faz, porque fazer indicando tempo é impessoal."],
["Crase é a fusão da preposição ‘a’ com o artigo ‘a’. Teste prático: troque a palavra feminina por uma masculina. Se der ‘ao’, use crase: ‘Vou à escola’ (Vou ao colégio). Não há crase antes de verbos, palavras masculinas e pronomes pessoais.","‘Fui à feira’ (Fui ao mercado): crase.<br>‘Comecei a estudar’: sem crase (verbo).<br>‘Entreguei a ela’: sem crase (pronome).<br>‘Cheguei à noite’: crase (locução adverbial feminina).","Precisa dos dois: preposição + artigo. Só um deles não dá crase.","Complete: ‘Entreguei o presente ___ minha mãe.’ (a/à)","À: o verbo entregar pede ‘a’ e ‘minha mãe’ pede o artigo ‘a’."],
["A vírgula separa aposto (Pedro, meu irmão, chegou), vocativo (Maria, venha aqui), adjunto adverbial deslocado (Ontem, choveu) e itens de lista (arroz, feijão e carne). Ela não separa sujeito de verbo nem verbo de complemento. Dois-pontos anunciam lista ou explicação. Ponto e vírgula separa partes longas.","‘Meu primo, que mora em Santos, chegou.’<br>‘Compre pão, leite e ovos.’<br>Errado: ‘Os alunos, estudaram.’ (separa o sujeito do verbo).","Costuma haver vírgula antes de ‘mas’, ‘porém’ e ‘contudo’.","Onde falta vírgula em ‘Ana minha amiga mora aqui’?","Ana, minha amiga, mora aqui (aposto)."],
["Metáfora: identifica uma coisa com outra sem ‘como’ (A vida é uma estrada). Comparação: usa ‘como’ (corre como o vento). Hipérbole: exagero (Morri de rir). Ironia: diz o contrário do que pensa. Personificação: ações humanas em seres não humanos (O vento sussurrava). Antítese: palavras opostas (amor e ódio). Eufemismo: suaviza (Ele partiu, para dizer que morreu).","‘O sol sorriu para nós’ → personificação.<br>‘Esperei uma eternidade’ → hipérbole.<br>‘Ele é um leão na briga’ → metáfora.","Se tem ‘como’, ‘tal qual’ ou ‘parece’, é comparação, não metáfora.","‘A noite chorou sobre a cidade’ é qual figura?","Personificação."],
["Ache a sílaba tônica. Oxítonas (última sílaba) levam acento se terminam em a(s), e(s), o(s), em, ens (café, também). Paroxítonas (penúltima) levam acento se terminam em l, n, r, x, ps, ão, i, us, um (fácil, táxi). Proparoxítonas (antepenúltima) sempre levam acento (médico, lâmpada).","‘café’: oxítona em e. ‘fácil’: paroxítona em l. ‘lâmpada’: proparoxítona. ‘jogo’: paroxítona em o, sem acento.<br>Mas/mais: ‘Quero mais, mas não posso.’<br>Há/a: ‘Há dois dias’ (passado) e ‘daqui a dois dias’ (futuro).","Por que (pergunta ou ‘o motivo pelo qual’), porque (resposta), porquê (substantivo, com artigo).","Por que ‘médico’ leva acento?","É proparoxítona, e toda proparoxítona é acentuada."],
["A língua muda conforme região (sotaques, gírias), grupo social, época e situação (formal ou informal). A norma culta é a variedade usada em situações formais, mas as outras não são ‘erradas’. Coesão: as palavras que costuram o texto (conectivos como ‘porém’, ‘portanto’ e pronomes que retomam ideias). Coerência: as ideias fazem sentido umas com as outras.","‘Estudei muito; portanto, fui bem.’ (conclusão)<br>‘Choveu, mas fomos à praia.’ (oposição)<br>‘Maria chegou. Ela estava cansada.’ (‘ela’ retoma Maria).","Porém/mas = oposição; pois/porque = causa; portanto/logo = conclusão.","Que ideia ‘portanto’ expressa?","Conclusão."]],
cie:[
["A célula é a menor unidade da vida. Toda célula tem membrana (controla o que entra e sai), citoplasma e material genético. A animal tem núcleo e mitocôndrias (liberam energia). A vegetal tem ainda parede celular (sustenta) e cloroplastos (fotossíntese). Bactérias não têm núcleo definido.","Fotossíntese: gás carbônico + água + luz → glicose + oxigênio. Acontece no cloroplasto.","Plantas também respiram: têm mitocôndrias e as usam o tempo todo.","Qual organela libera energia na célula?","A mitocôndria."],
["Digestório quebra o alimento e absorve nutrientes (no intestino delgado). Respiratório troca gases nos alvéolos dos pulmões. Circulatório leva o sangue: coração, artérias (saem do coração) e veias (voltam). Excretor filtra o sangue nos rins e produz urina. Nervoso comanda o corpo, e o endócrino usa hormônios.","Caminho do ar: nariz → faringe → laringe → traqueia → brônquios → pulmões.","Artérias levam o sangue do coração e veias o trazem de volta, e isso não depende da cor.","Qual órgão filtra o sangue e produz urina?","Os rins."],
["Doenças infecciosas vêm de microrganismos: vírus (gripe, dengue, sarampo), bactérias (tétano, tuberculose), protozoários (malária, doença de Chagas) e fungos. Vacinas treinam o corpo a se defender. Saneamento básico (água tratada e esgoto) evita verminoses e cólera. Contra a dengue, elimine água parada, onde o Aedes aegypti se reproduz.","Vacina: contém o microrganismo enfraquecido ou parte dele, e o corpo cria anticorpos.","Antibiótico mata bactérias, não vírus.","Como evitar a dengue?","Eliminando focos de água parada."],
["Cadeia alimentar: produtor (planta) → consumidor primário (herbívoro) → secundário (carnívoro) → decompositor (fungos e bactérias, que reciclam a matéria). A energia diminui a cada nível. Biomas: Amazônia (floresta úmida), Cerrado (savana), Caatinga (seco), Mata Atlântica (litoral), Pantanal (alagado), Pampa (campos do Sul). O efeito estufa retém calor, e gases como CO₂ e metano o aumentam.","Capim → gafanhoto → sapo → cobra → fungos.","Os decompositores reciclam nutrientes para os produtores.","Qual bioma é típico do Rio Grande do Sul?","O Pampa."],
["O DNA fica no núcleo e guarda as instruções do corpo. Um gene é um trecho do DNA. Cada característica é controlada por um par de alelos: o dominante (A) aparece mesmo sozinho, e o recessivo (a) só aparece em dupla. Seleção natural: seres mais adaptados ao ambiente sobrevivem mais e deixam mais descendentes.","Cruzamento Aa × Aa: AA, Aa, Aa e aa. 3/4 mostram a característica dominante e 1/4 a recessiva.","Dominante não quer dizer ‘mais comum’, e sim que aparece com um alelo só.","Aa × Aa: qual a chance de aa?","1/4 (25%)."],
["Estados físicos: sólido, líquido e gasoso. Fusão: sólido → líquido. Vaporização: líquido → gás. Condensação: gás → líquido. Solidificação: líquido → sólido. Sublimação: sólido → gás direto. Átomo: núcleo (prótons e nêutrons) e elétrons (−) ao redor. Número atômico = número de prótons. pH: ácido abaixo de 7, neutro 7, básico acima de 7.","Gelo derretendo: fusão. Roupa secando: vaporização. Gelo-seco virando fumaça: sublimação.","Derreter é mudança física (sem substância nova). Queimar e enferrujar são reações químicas.","O suco de limão tem pH maior ou menor que 7?","Menor que 7, por ser ácido."],
["Velocidade média = distância ÷ tempo. Inércia: sem força, o corpo continua parado ou em movimento reto (o cinto de segurança existe por isso). F = m × a: quanto mais massa, mais força para acelerar. Ação e reação: forças iguais em corpos diferentes. Energia não se cria nem se destrói, só se transforma. Calor flui do corpo quente para o frio.","Carro de 1.000 kg acelerando 2 m/s²: F = 1.000 × 2 = 2.000 N.","Ação e reação atuam em corpos diferentes, por isso não se anulam.","Que força acelera 5 kg a 3 m/s²?","F = 5 × 3 = 15 N."],
["Tensão (V, volts) empurra a corrente (i, amperes) por uma resistência (R, ohms): V = R × i. Potência (W) = V × i. Consumo em kWh = potência em kW × horas. Luz: reflexão (espelho) e refração (lápis ‘quebrado’ na água). O som precisa de meio material, é mais rápido nos sólidos que no ar e não existe no vácuo.","Chuveiro de 5.000 W (5 kW) ligado por 2 h: 5 × 2 = 10 kWh.","A luz viaja no vácuo, e o som não.","Qual a tensão com R = 10 Ω e i = 2 A?","V = 10 × 2 = 20 V."],
["A rotação da Terra (24 h) causa dia e noite. A translação (365 dias e 6 h) gera o ano. As estações vêm da inclinação do eixo, não da distância ao Sol. Fases da Lua: nova, crescente, cheia, minguante. Eclipse solar: a Lua passa entre a Terra e o Sol. Eclipse lunar: a Terra fica entre o Sol e a Lua.","Quando o Hemisfério Sul tem verão, o Norte tem inverno.","A distância entre a Terra e o Sol não causa as estações.","O que causa as estações do ano?","A inclinação do eixo da Terra durante a translação."]],
his:[
["Em 1500, os portugueses chegaram e primeiro exploraram o pau-brasil, com trabalho indígena (escambo). Em 1534 vieram as capitanias hereditárias e, em 1549, o governo-geral. A economia girou em torno da cana-de-açúcar (engenhos e escravidão africana) e, no século XVIII, do ouro em Minas. Houve resistência: quilombos (Palmares, Zumbi) e a Inconfidência Mineira (1789, Tiradentes).","Triângulo comercial: Portugal → África (escravizados) → Brasil (açúcar) → Europa.","Tiradentes foi executado em 1792, e a Inconfidência foi em 1789.","Que produto sustentou a economia colonial nos séculos XVI e XVII?","O açúcar."],
["Em 1808 a corte portuguesa fugiu de Napoleão e veio ao Brasil. Em 7 de setembro de 1822, D. Pedro proclamou a Independência. Períodos: Primeiro Reinado (1822-1831), Regência (1831-1840) e Segundo Reinado (1840-1889). O café dominou a economia. A escravidão acabou aos poucos: Eusébio de Queirós (1850), Ventre Livre (1871), Sexagenários (1885) e Lei Áurea (1888).","Ordem das leis: 1850, 1871, 1885 e 1888.","A Independência não acabou com a escravidão.","Quem proclamou a Independência?","D. Pedro I, em 7 de setembro de 1822."],
["A República (1889) começou com Deodoro da Fonseca. De 1894 a 1930 os presidentes vinham de SP e MG: política do café com leite. Coronéis controlavam o voto (voto de cabresto). Revoltas: Canudos (1896-97), Vacina (1904), Chibata (1910), Contestado (1912-16) e Tenentismo (anos 1920).","Revolta da Vacina: a população do Rio se revoltou contra a vacinação obrigatória contra a varíola.","Café com leite: café (São Paulo) e leite (Minas Gerais).","O que era o voto de cabresto?","O voto controlado pelos coronéis, sem liberdade do eleitor."],
["A Revolução de 1930 derrubou a República Velha e levou Getúlio Vargas ao poder. Em 1932 as mulheres conquistaram o voto. Em 1937, o golpe criou o Estado Novo: ditadura, censura (DIP) e propaganda. Vargas criou o salário mínimo e a CLT (1943) e incentivou a indústria (CSN). O regime caiu em 1945.","CLT: reúne leis trabalhistas, como carteira assinada e férias.","Vargas governou em fases: 1930-34, 1934-37, 1937-45 e 1951-54.","O que foi o Estado Novo?","A ditadura de Vargas, de 1937 a 1945."],
["De 1946 a 1964 houve democracia: Dutra, Vargas (1951-54, suicídio), JK (1956-61, Brasília), Jânio e Jango. Em 1964, golpe militar e ditadura. O AI-5 (1968) endureceu a censura e a repressão. O ‘milagre econômico’ marcou os anos 70. Em 1984, a campanha Diretas Já. Em 1985 acabou o regime e em 1988 veio a nova Constituição.","Brasília foi inaugurada por JK em 1960.","No ‘milagre econômico’, a economia cresceu, mas a desigualdade e a dívida também.","Que ato institucional endureceu a ditadura em 1968?","O AI-5."],
["Egito: faraós, rio Nilo, escrita hieroglífica. Mesopotâmia: escrita cuneiforme e Código de Hamurábi. Grécia: pólis, democracia em Atenas (só para homens livres) e filosofia (Sócrates, Platão, Aristóteles). Roma: república e depois império, direito romano. Idade Média: feudalismo (terra, servos e senhores), poder da Igreja, Cruzadas e retomada do comércio.","Democracia ateniense: direta, mas excluía mulheres, escravizados e estrangeiros.","A Antiguidade vai até a queda de Roma (476).","Qual era a base da economia feudal?","A terra e o trabalho dos servos."],
["Renascimento: valorização do ser humano e da ciência (Da Vinci). Reforma Protestante (Lutero, 1517). Absolutismo: poder concentrado no rei (Luís XIV). Grandes Navegações (séculos XV e XVI): Portugal e Espanha buscam rotas e riquezas. Mercantilismo: acumular metais e exportar mais do que importar. Iluminismo: razão contra o absolutismo. Revolução Francesa (1789): liberdade, igualdade e fraternidade.","1789: queda da Bastilha e Declaração dos Direitos do Homem e do Cidadão.","A independência dos EUA (1776) veio antes da Revolução Francesa.","Qual o lema da Revolução Francesa?","Liberdade, igualdade e fraternidade."],
["Revolução Industrial: máquinas, fábricas, burguesia e proletariado. Imperialismo: a Europa domina África e Ásia. Primeira Guerra (1914-18) e Revolução Russa (1917). Crise de 1929 (quebra da Bolsa de Nova York). Nazismo e fascismo. Segunda Guerra (1939-45): Holocausto e bombas atômicas. Guerra Fria: EUA × URSS, sem combate direto. ONU (1945) e Declaração Universal dos Direitos Humanos (1948).","Muro de Berlim: construído em 1961 e derrubado em 1989.","A Guerra Fria foi uma disputa ideológica (capitalismo × socialismo), sem combate direto entre as duas potências.","Quando começou a Segunda Guerra Mundial?","Em 1939, com a invasão da Polônia."],
["Direitos civis (liberdade, igualdade perante a lei), políticos (votar e ser votado) e sociais (educação, saúde, trabalho). A Constituição de 1988 garante esses direitos e marca a volta da democracia. Povos indígenas e quilombolas têm direito às suas terras. O voto é obrigatório de 18 a 70 anos e facultativo de 16 a 17, acima de 70 e para analfabetos.","O Estatuto da Criança e do Adolescente (1990) protege crianças e jovens.","Direitos vêm junto com deveres, como respeitar as leis e votar.","A partir de que idade o voto é facultativo?","A partir dos 16 anos (de 16 a 17 e depois dos 70)."]],
geo:[
["Escala mostra quantas vezes a realidade foi reduzida: 1:50.000 significa 1 cm = 50.000 cm = 500 m. Quanto maior o denominador, menor a escala (menos detalhe). Latitude: distância ao Equador (0° a 90° N ou S). Longitude: distância a Greenwich (0° a 180° L ou O). A Terra gira 360° em 24 h, então 15° = 1 hora de diferença: a leste é mais tarde, a oeste, mais cedo.","Mapa 1:200.000: 3 cm = 3 × 200.000 = 600.000 cm = 6 km.","Escala grande (1:1.000) mostra pouca área com muitos detalhes.","Em uma escala 1:500.000, 2 cm equivalem a quantos km?","2 × 500.000 = 1.000.000 cm = 10 km."],
["Tempo é o estado da atmosfera num momento. Clima é o padrão ao longo de décadas. Fatores: latitude (perto do Equador, mais quente), altitude (mais alto, mais frio), maritimidade e continentalidade, correntes marítimas e massas de ar. Climas do Brasil: equatorial (quente e úmido), tropical (verão chuvoso), semiárido (sertão), subtropical (Sul, 4 estações).","Chuva todo dia em Manaus: clima equatorial. Frio na serra gaúcha em julho: clima subtropical.","‘Hoje está chovendo’ é tempo. ‘No Norte chove muito’ é clima.","Por que lugares mais altos são mais frios?","O ar fica mais rarefeito e retém menos calor."],
["Planalto: terreno alto e desgastado pela erosão (maior parte do Brasil). Planície: terreno baixo e plano (Pantanal, Amazônica). Depressão: área mais baixa que o entorno. Montanha: altitude elevada. Intemperismo quebra as rochas e a erosão leva os sedimentos. Bacias: Amazônica (a maior), Tocantins-Araguaia, São Francisco (Nordeste) e Paraná (hidrelétricas).","Rio São Francisco: nasce em Minas Gerais e chega ao Atlântico, é o ‘rio da integração nacional’.","Sem vegetação, a erosão acelera.","Qual a maior bacia hidrográfica do Brasil?","A bacia Amazônica."],
["Amazônia: floresta equatorial, a maior biodiversidade. Cerrado: savana, ‘berço das águas’, muita agropecuária. Caatinga: vegetação adaptada à seca. Mata Atlântica: no litoral, restam cerca de 12% da cobertura original. Pantanal: planície alagável com grande fauna. Pampa: campos do Rio Grande do Sul.","Soja avançando no Cerrado e queimadas na Amazônia são ameaças atuais.","O Cerrado não é deserto: tem enorme biodiversidade.","Qual bioma é a maior planície alagável do mundo?","O Pantanal."],
["Natalidade (nascimentos) menos mortalidade (mortes) dá o crescimento vegetativo. O Brasil está envelhecendo: menos filhos e mais expectativa de vida, e a base da pirâmide etária estreita. Migrações: êxodo rural (campo → cidade) e pendular (casa ↔ trabalho). IDH combina saúde, educação e renda (0 a 1). Densidade demográfica = habitantes ÷ área.","10.000 habitantes em 100 km² → 100 hab./km².","O crescimento vegetativo não inclui a migração.","Qual a densidade de 5.000 hab. em 50 km²?","100 hab./km²."],
["Urbanização é o aumento da população urbana. No Brasil, acelerou depois de 1950 com a industrialização e o êxodo rural, e hoje mais de 80% vive em cidades. Consequências: favelas, trânsito, poluição, enchentes (solo impermeabilizado) e violência. Conurbação: cidades que se juntam. Região metropolitana: cidade grande e vizinhas.","São Paulo e Guarulhos são conurbadas.","Urbanização é a proporção da população que vive na cidade, não só o crescimento da cidade.","Por que as cidades alagam com facilidade?","O solo impermeabilizado (asfalto e concreto) impede a água de infiltrar."],
["Setor primário: retira da natureza (agricultura, pecuária, mineração). Secundário: transforma (indústria). Terciário: comércio e serviços (o maior no Brasil). Globalização: integração mundial de economia, cultura e comunicação, acelerada pela internet e pelos transportes. Blocos: Mercosul, União Europeia e BRICS. Energia renovável (hídrica, solar, eólica) e não renovável (petróleo, carvão).","Fábrica de carros: secundário. Banco: terciário. Soja: primário.","Renovável não é igual a ‘sem impacto’: hidrelétricas também alteram o ambiente.","Que setor da economia reúne comércio e serviços?","O terciário."],
["Norte: maior em área, Amazônia, Zona Franca de Manaus. Nordeste: litoral úmido, sertão seco e turismo. Centro-Oeste: agronegócio e Brasília. Sudeste: a mais populosa e industrializada. Sul: pecuária e colonização europeia. Atualidades: mudanças climáticas, transição energética, conflitos, inteligência artificial e desinformação.","Brasília é a capital federal e fica no Centro-Oeste.","Maior em área é o Norte, e mais populosa é o Sudeste.","Qual região tem a Zona Franca de Manaus?","A região Norte."]]};
